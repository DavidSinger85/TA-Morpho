name: release

# Runs the tests (tests.yml), then builds the desktop program for Windows and macOS,
# checks each build with its self-test, and attaches the installers to the GitHub release.
# Trigger: push a version tag (git tag v1.0.0 && git push origin v1.0.0), or run
# it by hand from the Actions tab (the installers are then kept as artifacts).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml     # the installers are built only if all tests pass

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-15            # Apple Silicon (M1 and later); macos-14 is retired on 2026-11-02
            label: macOS-AppleSilicon
          - os: macos-15-intel      # Intel Macs
            label: macOS-Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt
      - name: Install dependencies
        run: pip install -e ".[gui]" -c requirements-lock.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.7
      - name: Version (from ta_morpho/__init__.py; a tag must match it)
        shell: bash
        run: |
          v="$(python -c 'import ta_morpho; print(ta_morpho.__version__)')"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the program version $v (ta_morpho/__init__.py)"
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build the program
        run: pyinstaller --noconfirm packaging/ta_morpho.spec

      # The built program has no console on Windows: its result is read from the log file.
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\TA-Morpho\TA-Morpho.exe" `
                             -ArgumentList "--self-test", "--log", "self_test.log" -PassThru
          $null = $p.Handle         # keeps the process handle, so that ExitCode is readable after it ends
          if (-not $p.WaitForExit(600000)) { $p.Kill(); Write-Error "self-test did not finish in 10 minutes"; exit 1 }
          if (Test-Path self_test.log) { Get-Content self_test.log }
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed ($($p.ExitCode))"; exit 1 }
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: dist/TA-Morpho.app/Contents/MacOS/TA-Morpho --self-test --log self_test.log

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=$env:VERSION packaging\windows_installer.iss
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p installers
          hdiutil create -volname "TA-Morpho" -srcfolder dist/TA-Morpho.app \
            -ov -format UDZO "installers/TA-Morpho-${VERSION}-${{ matrix.label }}.dmg"

      - uses: actions/upload-artifact@v6
        with:
          name: TA-Morpho-${{ matrix.label }}
          path: installers/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
